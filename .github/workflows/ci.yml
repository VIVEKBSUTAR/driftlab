name: Verify DriftLab
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked --extra dev
      - run: uv run --frozen --extra dev ruff check src tests scripts examples
      - run: uv run --frozen --extra dev ruff format --check src tests scripts examples
      - run: uv run --frozen --extra dev pytest tests/ -m 'not embeddings' -q
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - run: uv run --frozen --extra dev python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
      - run: uv export --frozen --no-dev --no-default-groups --no-emit-project --no-annotate --format requirements-txt --output-file requirements.lock && git diff --exit-code requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix frontend --audit-level=low
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked --extra dev
      - run: npm ci --prefix frontend
      - run: uv run --frozen --extra dev python scripts/build_release.py
      - run: uv run --frozen --extra dev python scripts/verify_release.py
      - run: uv run --frozen --extra dev pip-audit -r requirements.lock --no-deps --disable-pip
      - uses: actions/upload-artifact@v4
        with:
          name: driftlab-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t driftlab:ci .
      - name: Exercise authenticated deployment
        env:
          DRIFTLAB_API_KEY: ci-ephemeral-workspace-key-not-a-production-secret
          DRIFTLAB_ALLOWED_HOSTS: localhost,127.0.0.1
          DRIFTLAB_ALLOWED_ORIGINS: https://localhost
          DRIFTLAB_DOMAIN: localhost
        run: |
          docker compose config --quiet
          docker run -d --name driftlab-test -p 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:size=256m --cap-drop=ALL \
            --security-opt=no-new-privileges --init \
            -e DRIFTLAB_API_KEY -e DRIFTLAB_ALLOWED_HOSTS -e DRIFTLAB_ALLOWED_ORIGINS \
            -v driftlab-test-data:/var/lib/driftlab driftlab:ci
          python scripts/container_smoke.py
          docker restart driftlab-test
          for attempt in $(seq 1 60); do
            if docker exec driftlab-test python -m driftlab.healthcheck; then break; fi
            sleep 1
          done
          docker exec driftlab-test python -m driftlab.healthcheck
          python - <<'PY'
          import json, os, urllib.request
          r = urllib.request.Request('http://127.0.0.1:8000/api/workspace', headers={'Authorization': 'Bearer '+os.environ['DRIFTLAB_API_KEY']})
          with urllib.request.urlopen(r) as response:
              assert json.load(response)['runs'] == 2
          PY
      - name: Container diagnostics
        if: always()
        run: docker logs driftlab-test || true
