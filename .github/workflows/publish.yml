name: Publish reviewed Python package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked --extra dev
      - run: uv run --frozen --extra dev pytest tests/ -m 'not embeddings' -q
      - run: npm ci --prefix frontend && npm test --prefix frontend
      - run: uv run --frozen --extra dev python scripts/build_release.py
      - run: uv run --frozen --extra dev python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/driftlab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
