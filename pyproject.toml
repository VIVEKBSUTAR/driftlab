[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftlab"
version = "0.1.0"
description = "A framework for behavioral drift detection and validation in local LLMs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "sentence-transformers>=2.2.0",
    "typer>=0.9.0",
    "requests>=2.31.0",
]

[project.scripts]
driftlab = "driftlab.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
